<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENESIS RMS — Remote Management System | Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('scada_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    html.dark body {
      background: #090d16 !important;
      color: #f1f5f9 !important;
    }
    html.dark .bg-white {
      background-color: rgba(14, 18, 30, 0.94) !important;
      border-color: rgba(51, 65, 85, 0.7) !important;
      color: #f8fafc !important;
    }
    html.dark input {
      background-color: rgba(22, 28, 46, 0.85) !important;
      border-color: rgba(71, 85, 105, 0.6) !important;
      color: #f8fafc !important;
    }
    html.dark .text-slate-900 {
      color: #f8fafc !important;
    }
    html.dark .text-slate-600 {
      color: #94a3b8 !important;
    }
    html.dark .text-slate-400 {
      color: #64748b !important;
    }
    html.dark .border-slate-200 {
      border-color: rgba(51, 65, 85, 0.6) !important;
    }
    html.dark .border-slate-100 {
      border-color: rgba(51, 65, 85, 0.5) !important;
    }
  </style>
</head>
<body>

  <!-- Sign In Card (Exact match to media_1794805960363_83b111fb.jpg) -->
  <div class="bg-white rounded-[32px] p-8 sm:p-12 border border-slate-100 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.06)] max-w-[460px] w-full text-center select-none">
    
    <!-- Top Branding -->
    <div class="flex items-center justify-center gap-3">
      <img src="Arena IoT Connected Logo.png" alt="Arena IoT" class="h-8 sm:h-9 w-auto object-contain shrink-0" />
      <div class="h-6 w-px bg-slate-200 shrink-0"></div>
      <div class="flex items-center gap-1.5">
        <span class="text-base font-black tracking-tight text-slate-900">GENESIS</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 text-white">RMS</span>
      </div>
    </div>
    
    <div class="text-xs text-slate-600 font-medium tracking-tight mt-1 mb-6">
      Remote Management System
    </div>

    <!-- Heading -->
    <h1 class="text-3xl font-black text-slate-900 tracking-tight mb-1.5">
      Welcome Back
    </h1>
    <p class="text-xs sm:text-sm text-slate-600 font-medium mb-7">
      Sign in to your account to continue
    </p>

    <!-- Sign In Form -->
    <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
      
      <!-- Username / Email Field -->
      <div class="relative flex items-center rounded-full border border-slate-200/90 bg-white px-4 py-3.5 focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition shadow-2xs">
        <svg class="w-4 h-4 text-slate-400 shrink-0 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="login-user" value="lian.ahmed@arenaiot.com" placeholder="Username / Email" class="w-full text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none bg-transparent" required />
      </div>

      <!-- Password Field -->
      <div class="relative flex items-center rounded-full border border-slate-200/90 bg-white px-4 py-3.5 focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition shadow-2xs">
        <svg class="w-4 h-4 text-slate-400 shrink-0 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="login-pass" value="••••••••" placeholder="Password" class="w-full text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none bg-transparent" required />
        <button type="button" onclick="togglePasswordVisibility()" class="text-slate-400 hover:text-slate-600 shrink-0 ml-2 focus:outline-none" title="Toggle password view">
          <svg id="eye-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        </button>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between text-xs pt-1 px-1">
        <label class="flex items-center gap-2 text-slate-600 cursor-pointer select-none">
          <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600 rounded" />
          <span class="font-medium">Remember me</span>
        </label>
        <a href="javascript:void(0)" onclick="promptPasswordReset()" class="text-indigo-600 hover:text-indigo-800 font-semibold transition">
          Forgot Password?
        </a>
      </div>

      <!-- Sign In Button -->
      <div class="pt-3">
        <button type="submit" class="w-full py-3.5 px-6 rounded-full bg-[#4338ca] hover:bg-[#3730a3] text-white font-bold text-sm sm:text-base flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition cursor-pointer">
          <span>Sign In</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </form>

    <!-- Sign Up Link -->
    <div class="mt-6 pt-5 border-t border-slate-100 text-xs text-slate-600">
      <span>Don't have an operator account?</span>
      <a href="signup.html" class="text-indigo-600 hover:text-indigo-800 font-bold ml-1 transition">
        Register New Account →
      </a>
    </div>

  </div>

  <script>
    function promptPasswordReset() {
      const email = prompt('Enter your corporate SCADA email for password recovery dispatch:', 'lian.ahmed@arenaiot.com');
      if (email) {
        alert('Password reset token dispatched to ' + email + ' via secure SCADA gateway.');
      }
    }

    function togglePasswordVisibility() {
      const p = document.getElementById('login-pass');
      const eye = document.getElementById('eye-icon');
      if (p.type === 'password') {
        p.type = 'text';
        eye.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      } else {
        p.type = 'password';
        eye.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      // Ensure active session
      localStorage.setItem('genesis_session_active', 'true');
      // Seamless redirect to Master Dashboard overview.html
      window.location.href = 'overview.html';
    }
  </script>
</body>
</html>
