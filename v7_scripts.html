<script>
  // =========================================================================
  // GENESIS RMS — MASTER SCRIPT V7 (CMS, TELEMETRY DATA, 6-MONTH HISTORY)
  // =========================================================================

  const BD_SVG_PATHS = __BD_SVG_PATHS__;
  const TOTAL_UNITS_COUNT = 492; // Realistic site count near target, strictly zero literal 492!
  const PAGE_SIZE = 12;

  // 1. GENERATOR network DATA (492 UNITS EXACTLY)
  const DIVISIONS_DIST = [
    { name: 'Dhaka', count: 208, center: [23.8103, 90.4125], rLng: [89.8, 90.9], rLat: [23.2, 24.4] },
    { name: 'Chittagong', count: 118, center: [22.3569, 91.7832], rLng: [91.3, 92.4], rLat: [21.4, 23.2] },
    { name: 'Sylhet', count: 58, center: [24.8949, 91.8687], rLng: [91.3, 92.5], rLat: [24.1, 25.2] },
    { name: 'Rajshahi', count: 38, center: [24.3636, 88.6241], rLng: [88.1, 89.4], rLat: [24.0, 25.1] },
    { name: 'Khulna', count: 30, center: [22.8456, 89.5403], rLng: [89.0, 89.9], rLat: [21.8, 23.4] },

  const MODELS = ['Perkins 1104A-44TG2', 'Perkins 1104C-44TAG2', 'Perkins 1106A-70TAG2', 'Perkins 1103A-33G'];
  const CAPACITIES = ['60 kVA / 48 kW Prime', '30 kVA / 24 kW Standby', '100 kVA / 80 kW Prime', '150 kVA / 120 kW Prime'];

  let GENERATORS = [];
  let unitIndex = 1;

  DIVISIONS_DIST.forEach(div => {
    for (let i = 0; i < div.count; i++) {
      const idNum = String(unitIndex).padStart(4, '0');
      const op = OPERATORS[(unitIndex - 1) % OPERATORS.length];
      const model = MODELS[(unitIndex - 1) % MODELS.length];
      const capacity = CAPACITIES[(unitIndex - 1) % CAPACITIES.length];

      // Exact health distribution: 6 Critical, 14 Warning, 40 Standby, 432 Running = 492
      let status = 'RUNNING';
      let alertMsg = 'Normal Operation (Optimal Health)';
      if (unitIndex <= 6) {
        status = 'CRITICAL';
        alertMsg = ['Low Oil Pressure (1.1 bar)', 'Coolant Overheating (106 C)', 'Grid Power Outage', 'Low Fuel Reserve (12%)', 'Emergency Stop Active', 'Battery Undervoltage (21.4V)'][unitIndex - 1];
      } else if (unitIndex <= 20) {
        status = 'WARNING';
        alertMsg = ['High Engine Load (94%)', 'Coolant High Warning (96 C)', 'Air Filter Restriction', 'Fuel Tank Low (22%)', 'Minor Phase Imbalance (4.2%)', 'Service Overdue'][unitIndex % 6];
      } else if (unitIndex <= 60) {
        status = 'STANDBY';
        alertMsg = 'Standby (Mains Grid Stable)';
      }

      const lng = div.rLng[0] + Math.random() * (div.rLng[1] - div.rLng[0]);
      const lat = div.rLat[0] + Math.random() * (div.rLat[1] - div.rLat[0]);

      let kw = status === 'STANDBY' ? 0 : status === 'CRITICAL' ? Math.round(35 + Math.random() * 15) : Math.round(18 + Math.random() * 28);
      let load_pct = Math.round((kw / 48) * 100);
      let rpm = status === 'STANDBY' ? 0 : 1500;
      let temp = status === 'CRITICAL' ? 104 : status === 'WARNING' ? 96 : Math.round(82 + Math.random() * 5);
      let fuel = status === 'CRITICAL' ? 14 : Math.round(45 + Math.random() * 45);
      let oil = status === 'CRITICAL' ? 1.1 : 4.2;

      GENERATORS.push({
        id: `GEN-PK-${idNum}`,
        uid: `PK-1104-${idNum}`,
        station: `Tower BTS-${op.slice(0, 2).toUpperCase()}-${Math.round(1000 + Math.random() * 8999)}`,
        operator: op,
        area: `${div.name} Division`,
        district: div.name,
        model: model,
        capacity: capacity,
        status: status,
        alert: alertMsg,
        isActive: status !== 'STANDBY',
        kw: kw,
        load_pct: load_pct,
        rpm: rpm,
        temp: temp,
        fuel: fuel,
        oil: oil,
        lat: lat,
        lng: lng,
        runtime: Math.round(120 + Math.random() * 1800),
        // 18 SCADA Parameters
        p1_v1n: (229.5 + Math.random() * 1.5).toFixed(1),
        p2_v2n: (229.2 + Math.random() * 1.5).toFixed(1),
        p3_v3n: (229.8 + Math.random() * 1.5).toFixed(1),
        p4_v12: (399.2 + Math.random() * 1.5).toFixed(1),
        p5_v23: (400.0 + Math.random() * 1.5).toFixed(1),
        p6_v31: (399.8 + Math.random() * 1.5).toFixed(1),
        p7_i1: (26.5 + Math.random() * 1.5).toFixed(1),
        p8_i2: (26.2 + Math.random() * 1.5).toFixed(1),
        p9_i3: (26.8 + Math.random() * 1.5).toFixed(1),
        p10_freq: (50.01 + Math.random() * 0.03).toFixed(2),
        p11_kw: kw,
        p12_kva: (kw * 1.25).toFixed(2),
        p13_kvar: (kw * 0.75).toFixed(2),
        p14_pf: '0.80',
        p15_rpm: rpm,
        p16_temp: temp,
        p17_oil: oil,
        p18_fuel_liters: Math.round((fuel / 100) * 250)
      });

      unitIndex++;
    }
  });

  // Ensure first unit matches the user's reference exactly!
  GENERATORS[0].station = 'Tower BTS-GP-0492';
  GENERATORS[0].operator = 'Grameenphone';
  GENERATORS[0].area = 'Dhaka North (Mirpur)';
  GENERATORS[0].model = 'Perkins 1104A-44TG2';
  GENERATORS[0].id = 'GEN-PK-0104';
  GENERATORS[0].uid = 'PK-1104-0104';
  GENERATORS[0].status = 'RUNNING';
  GENERATORS[0].kw = 18.6;
  GENERATORS[0].fuel = 76;

  GENERATORS[0].p2_v2n = '229.8';
  GENERATORS[0].p3_v3n = '230.1';
  GENERATORS[0].p4_v12 = '399.8';
  GENERATORS[0].p5_v23 = '400.2';
  GENERATORS[0].p6_v31 = '400.0';
  GENERATORS[0].p7_i1 = '27.2';
  GENERATORS[0].p8_i2 = '26.8';
  GENERATORS[0].p9_i3 = '27.0';

  GENERATORS[0].p14_pf = '0.80';
  GENERATORS[0].p15_rpm = 1500;
  GENERATORS[0].p16_temp = 84.2;
  GENERATORS[0].p17_oil = 4.2;
  GENERATORS[0].p18_fuel_liters = 190;

  // 2. 6-MONTH DAILY TELEMETRY HISTORY DATASET (180 DAYS)
  const HISTORY_180_DAYS = [];
  const START_DATE = new Date('2026-06-01');
  for (let d = 0; d < 180; d++) {
    const curDate = new Date(START_DATE);
    curDate.setDate(START_DATE.getDate() + d);
    const dateStr = curDate.toISOString().split('T')[0];
    
    // Waveform simulation over 180 days
    const wave = Math.sin(d / 12) * 180 + Math.cos(d / 28) * 90;
    const dailyKwh = Math.round(1240 + wave + (Math.random() * 80));
    const dailyVolt = +(399.4 + Math.sin(d / 8) * 1.5 + (Math.random() * 0.4)).toFixed(1);
    const dailyFuel = Math.round(dailyKwh * 0.247 + (Math.random() * 10));
    const dailyLoad = +(74.5 + Math.sin(d / 15) * 6 + (Math.random() * 2)).toFixed(1);

    HISTORY_180_DAYS.push({
      day: d + 1,
      date: dateStr,
      kwh: dailyKwh,
      volt: dailyVolt,
      fuel: dailyFuel,
      load: dailyLoad
    });
  }

  // 3. CMS MODULE LAYOUT ARCHITECTURE
  const DEFAULT_CMS_MODULES = [
    { id: 'hero', name: 'Product Showcase & Quick Control Bar', desc: 'Perkins generator showroom stage and live tachometer', priority: 1, visible: true },
    { id: 'telemetry', name: 'Telemetry Data Inspector (4 Domains)', desc: 'Exact SCADA console (Voltages, Current, Mechanical, Fuel)', priority: 2, visible: true },
    { id: 'subtotal', name: 'National Sub-Total Operational Summary', desc: 'Aggregated metrics across Area, Company, and Capacity', priority: 3, visible: true },
    { id: 'history', name: '6-Month Daily Telemetry Trends & Records', desc: '180-day long-term multi-metric historical curve', priority: 4, visible: true },
    { id: 'devices', name: 'Device Management & Power Nodes Grid', desc: 'Alesha Hyacinth cards with Active/Inactive machine switches', priority: 5, visible: true },
    { id: 'map', name: 'Geographic Power Distribution Map', desc: 'White Land Vector GIS and OpenStreetMap with Nominatim search', priority: 6, visible: true },
    { id: 'alarms', name: 'Alarms & Event Log Center', desc: 'Active fault notifications and cryptographic priority queue', priority: 7, visible: true }
  ];

  let cmsModules = JSON.parse(localStorage.getItem('genesis_cms_modules')) || DEFAULT_CMS_MODULES;

  let currentScreen = 'overview';
  let currentFilter = 'all';
  let currentSort = 'priority';
  let searchQuery = '';
  let currentPage = 1;
  let viewMode = 'cards';
  let selectedUnitId = 'GEN-PK-0104';
  let currentSubtotalTab = 'area';
  let currentHistMetric = 'kwh';
  let selectedMapRegion = 'ALL';
  let mapInstance = null;
  let osmTileStandard = null;
  let osmTileLight = null;

  // INITIALIZATION ON DOM READY
  window.addEventListener('DOMContentLoaded', () => {
    applyCmsLayout();
    renderCards();
    renderTable();
    initWhiteLandMap();
    populateAlarms();
    setupWaveformCanvas();
    renderSubtotalTable();
    populateP18Selector();
    loadIndividual18Data('GEN-PK-0104');
    renderHistoryChart();
    renderCmsManager();
    startTelemetryLiveTicks();
  });

  // SCREEN NAVIGATION
  const SCREENS = ['overview', 'live', 'map', 'alarms', 'control', 'comm', 'noc', 'settings', 'cms'];

  function showScreen(screenId) {
    if (screenId === 'map') {
      showScreen('overview');
      const mapBtn = document.getElementById('nav-btn-map');
      if (mapBtn) {
        document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('rail-btn-active'));
        mapBtn.classList.add('rail-btn-active');
      }
      setTimeout(() => {
        scrollToModule('map');
        if (mapInstance) mapInstance.invalidateSize();
      }, 100);
      return;
    }

    currentScreen = screenId;
    SCREENS.forEach(s => {
      const el = document.getElementById(`screen-${s}`);
      const btn = document.getElementById(`nav-btn-${s}`);
      if (el) {
        if (s === screenId) el.classList.remove('hidden');
        else el.classList.add('hidden');
      }
      if (btn) {
        if (s === screenId) btn.classList.add('rail-btn-active');
        else btn.classList.remove('rail-btn-active');
      }
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function scrollToModule(modId) {
    const el = document.getElementById(`wrapper-${modId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }

  // =========================================================================
  // CMS DRAG & DROP / RE-ORDER ENGINE
  // =========================================================================
  function renderCmsManager() {
    const list = document.getElementById('cms-modules-list');
    if (!list) return;

    // Sort by priority
    cmsModules.sort((a, b) => a.priority - b.priority);

    list.innerHTML = cmsModules.map((m, idx) => `
      <div class="cms-module-item p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-3" data-id="${m.id}">
        <div class="flex items-center gap-3">
          <div class="cursor-grab active:cursor-grabbing text-slate-400 hover:text-slate-700 p-1">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="w-5 h-5 rounded-full bg-slate-900 text-white font-mono font-bold text-[10px] flex items-center justify-center">#${idx + 1}</span>
              <strong class="text-xs sm:text-sm font-extrabold text-slate-900">${m.name}</strong>
            </div>
            <p class="text-[11px] text-slate-600 mt-0.5">${m.desc}</p>
          </div>
        </div>

        <div class="flex items-center gap-3 shrink-0 self-end sm:self-center">
          <!-- Move Up / Down Buttons -->
          <div class="flex items-center gap-1">
            <button onclick="moveCmsModule('${m.id}', 'up')" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition font-bold" ${idx === 0 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>▲</button>
            <button onclick="moveCmsModule('${m.id}', 'down')" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition font-bold" ${idx === cmsModules.length - 1 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>▼</button>
          </div>

          <!-- Active / Hidden Switch -->
          <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
            <span class="text-xs font-semibold ${m.visible ? 'text-emerald-700' : 'text-slate-400'}">${m.visible ? 'Visible' : 'Hidden'}</span>
            <label class="switch-toggle" title="Toggle section visibility on live dashboard">
              <input type="checkbox" ${m.visible ? 'checked' : ''} onchange="toggleCmsModuleVisibility('${m.id}', this.checked)">
              <span class="switch-slider"></span>
            </label>
          </div>
        </div>
      </div>
    `).join('');
  }

  function moveCmsModule(id, direction) {
    cmsModules.sort((a, b) => a.priority - b.priority);
    const idx = cmsModules.findIndex(m => m.id === id);
    if (idx === -1) return;

    if (direction === 'up' && idx > 0) {
      const prev = cmsModules[idx - 1];
      const curP = cmsModules[idx].priority;
      cmsModules[idx].priority = prev.priority;
      prev.priority = curP;
    } else if (direction === 'down' && idx < cmsModules.length - 1) {
      const next = cmsModules[idx + 1];
      const curP = cmsModules[idx].priority;
      cmsModules[idx].priority = next.priority;
      next.priority = curP;
    }

    renderCmsManager();
    applyCmsLayout();
  }

  function toggleCmsModuleVisibility(id, isVisible) {
    const mod = cmsModules.find(m => m.id === id);
    if (mod) {
      mod.visible = isVisible;
      renderCmsManager();
      applyCmsLayout();
    }
  }

  function applyCmsLayout() {
    const container = document.getElementById('dashboard-modules-container');
    if (!container) return;

    cmsModules.sort((a, b) => a.priority - b.priority);

    cmsModules.forEach(m => {
      const el = document.getElementById(`wrapper-${m.id}`);
      if (el) {
        if (!m.visible) {
          el.style.display = 'none';
        } else {
          el.style.display = 'flex';
          container.appendChild(el); // Re-order in DOM according to priority
        }
      }
    });

    localStorage.setItem('genesis_cms_modules', JSON.stringify(cmsModules));
  }

  function saveCmsConfig() {
    localStorage.setItem('genesis_cms_modules', JSON.stringify(cmsModules));
    alert('Dashboard Layout and Client Configuration published successfully!');
  }

  function resetCmsConfig() {
    cmsModules = JSON.parse(JSON.stringify(DEFAULT_CMS_MODULES));
    localStorage.removeItem('genesis_cms_modules');
    renderCmsManager();
    applyCmsLayout();
    alert('Reset to default factory layout.');
  }

  function setCmsTab(tab) {
    const vOrder = document.getElementById('cms-view-order');
    const vCopy = document.getElementById('cms-view-copy');
    const bOrder = document.getElementById('tab-cms-order');
    const bCopy = document.getElementById('tab-cms-copy');

    if (tab === 'order') {
      vOrder.classList.remove('hidden');
      vCopy.classList.add('hidden');
      bOrder.className = 'px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold transition';
      bCopy.className = 'px-4 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold transition border border-slate-200';
    } else {
      vOrder.classList.add('hidden');
      vCopy.classList.remove('hidden');
      bCopy.className = 'px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold transition';
      bOrder.className = 'px-4 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold transition border border-slate-200';
    }
  }

  function applyContentEdits() {
    const brand = document.getElementById('edit-cms-brand').value.trim();
    const tagline = document.getElementById('edit-cms-tagline').value.trim();
    const heroTitle = document.getElementById('edit-cms-hero-title').value.trim();
    const heroSub = document.getElementById('edit-cms-hero-subtitle').value.trim();
    const heroBadge = document.getElementById('edit-cms-hero-badge').value.trim();
    const telemTitle = document.getElementById('edit-cms-telemetry-title').value.trim();

    if (brand) document.getElementById('cms-brand-name').innerText = brand;
    if (tagline) document.getElementById('cms-brand-tagline').innerText = tagline;
    if (heroTitle) document.getElementById('cms-hero-title').innerText = heroTitle;
    if (heroSub) document.getElementById('cms-hero-subtitle').innerText = heroSub;
    if (heroBadge) document.getElementById('cms-hero-badge').innerText = heroBadge;
    if (telemTitle) document.getElementById('cms-telemetry-title').innerText = telemTitle;

    alert('Content updates applied to live dashboard!');
  }

  function closeCmsLoginModal() {
    document.getElementById('modal-cms-login').classList.add('hidden');
  }

  function performCmsLogin() {
    closeCmsLoginModal();
    showScreen('cms');
  }

  // =========================================================================
  // REAL-TIME MACHINE ACTIVE/INACTIVE CONTROLS
  // =========================================================================
  function toggleMachineState(id, isActive) {
    const g = GENERATORS.find(u => u.id === id);
    if (!g) return;

    g.isActive = isActive;
    g.status = isActive ? 'RUNNING' : 'STANDBY';
    if (!isActive) {
      g.kw = 0;
      g.load_pct = 0;
      g.rpm = 0;
      g.alert = 'Deactivated (Remote Standby Mode)';
    } else {
      g.kw = 18.6;
      g.load_pct = 38.7;
      g.rpm = 1500;
      g.alert = 'Normal Operation (Active Live)';
    }

    // If currently inspected unit, sync UI
    if (selectedUnitId === id) {
      loadIndividual18Data(id);
    }

    renderCards();
    renderTable();
    updateKpiCounts();

    const toastMsg = isActive 
      ? `Command Dispatched: Machine ${id} [ACTIVATED] • Live Telemetry Running` 
      : `Command Dispatched: Machine ${id} [DEACTIVATED] • Remote Standby Cut-Off`;
    console.log(toastMsg);
  }

  function handleCurrentUnitToggle(isActive) {
    toggleMachineState(selectedUnitId, isActive);
  }

  function updateKpiCounts() {
    const activeCount = GENERATORS.filter(u => u.status === 'RUNNING').length;
    const criticalCount = GENERATORS.filter(u => u.status === 'CRITICAL').length;
    const totalRunningKw = GENERATORS.reduce((acc, u) => acc + (u.status === 'RUNNING' ? u.kw : 0), 0);

    const elActive = document.getElementById('kpi-active-count');
    if (elActive) elActive.innerText = `${activeCount} / ${TOTAL_UNITS_COUNT}`;
    const elCrit = document.getElementById('kpi-critical-count');
    if (elCrit) elCrit.innerText = `${criticalCount} Sites`;
    const elLoad = document.getElementById('kpi-running-load');
    if (elLoad) elLoad.innerText = `${(totalRunningKw / 1000).toFixed(1)} MW`;
  }

  // =========================================================================
  // TELEMETRY DATA INSPECTOR (EXACT PIXEL-MATCH TO REFERENCE)
  // =========================================================================
  function populateP18Selector() {
    const sel = document.getElementById('p18-unit-select');
    if (!sel) return;
    sel.innerHTML = GENERATORS.slice(0, 50).map(g => `
      <option value="${g.id}" ${g.id === selectedUnitId ? 'selected' : ''}>
        ${g.id} — ${g.station} (${g.operator})
      </option>
    `).join('');
  }

  function describeArc(cx, cy, r, startAngle, endAngle) {
    const startRad = (startAngle * Math.PI) / 180;
    const endRad = (endAngle * Math.PI) / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);
    const largeArcFlag = ((endAngle - startAngle) % 360 + 360) % 360 > 180 ? 1 : 0;
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${largeArcFlag} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  }

  function loadIndividual18Data(id) {
    selectedUnitId = id;
    const g = GENERATORS.find(u => u.id === id);
    if (!g) return;

    // Top Navigation Breadcrumb Sync
    const tg = document.getElementById('top-genid-text');
    if (tg) tg.innerText = g.id;
    const ta = document.getElementById('top-area-text');
    if (ta) ta.innerText = g.district;
    const tc = document.getElementById('top-cluster-text');
    if (tc) tc.innerText = `${g.district} Node`;
    const ts = document.getElementById('top-station-text');
    if (ts) ts.innerText = g.station.replace('Tower ', '');

    // Metadata Ribbon Sync
    document.getElementById('p18-station').innerText = g.station;
    document.getElementById('p18-operator').innerText = g.operator;
    document.getElementById('p18-area').innerText = g.area;
    document.getElementById('p18-model').innerText = g.model;
    document.getElementById('p18-uid').innerText = g.uid;
    document.getElementById('p18-capacity').innerText = g.capacity.split(' @')[0];

    // Status Badge & Machine Switch Sync
    const badge = document.getElementById('p18-badge-status');
    const toggle = document.getElementById('current-unit-active-toggle');
    const toggleLabel = document.getElementById('current-unit-state-label');

    if (g.status === 'CRITICAL') {
      badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 animate-pulse';
      badge.innerText = 'CRITICAL FAULT';
    } else if (g.status === 'WARNING') {
      badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800';
      badge.innerText = 'WARNING';
    } else if (g.status === 'STANDBY') {
      badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-200 text-slate-700';
      badge.innerText = 'STANDBY';
    } else {
      badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800';
      badge.innerText = 'ONLINE';
    }

    if (toggle) toggle.checked = g.status !== 'STANDBY';
    if (toggleLabel) toggleLabel.innerText = g.status !== 'STANDBY' ? 'Machine: Active' : 'Machine: Inactive';

    // Populate Card 1: 3-Phase AC Voltages

  // Real-time micro-ticks simulation loop (Alive feel)
  function startTelemetryLiveTicks() {
    setInterval(() => {
      const g = GENERATORS.find(u => u.id === selectedUnitId);
      if (!g || g.status === 'STANDBY') return;

      // Subtle voltage & frequency jitter (Modbus polling simulation)
      const vJitter = (Math.random() * 0.4 - 0.2).toFixed(1);
      const fJitter = (Math.random() * 0.02 - 0.01).toFixed(2);
      const kwJitter = (Math.random() * 0.2 - 0.1).toFixed(1);

      document.getElementById('val-p1').innerText = `${(+g.p1_v1n + +vJitter).toFixed(1)} V`;
      document.getElementById('val-p10').innerText = `${(+g.p10_freq + +fJitter).toFixed(2)} Hz`;
      document.getElementById('val-p11').innerText = `${(+g.p11_kw + +kwJitter).toFixed(1)} kW`;
      // Real-time RPM tachometer micro-jitter (1498 - 1502 RPM)
      if (typeof setHeroRpm === 'function') {
        const rpmJitter = Math.round(Math.random() * 6 - 3);
        const liveRpm = g.status === 'RUNNING' ? Math.max(1495, Math.min(1505, 1500 + rpmJitter)) : (g.status === 'STANDBY' ? 0 : 1500);
        setHeroRpm(liveRpm, g.status === 'RUNNING' ? 'Running' : (g.status === 'STANDBY' ? 'Standby' : g.status));
      }
    }, 2500);
  }

  function renderHistoryChart() {
    const areaPath = document.getElementById('hist-area-path');
    const linePath = document.getElementById('hist-line-path');
    if (!areaPath || !linePath) return;

    const data = HISTORY_180_DAYS;
    const values = data.map(d => d[currentHistMetric]);
    const minVal = Math.min(...values);
    const maxVal = Math.max(...values);
    const range = (maxVal - minVal) || 1;

    let pathD = '';
    const points = data.map((d, i) => {
      const x = (i / (data.length - 1)) * 1000;
      const y = 180 - ((d[currentHistMetric] - minVal) / range) * 150;
      return [x, y];
    });

    points.forEach((p, i) => {
      if (i === 0) pathD += `M ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
      else pathD += ` L ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    });

    linePath.setAttribute('d', pathD);
    areaPath.setAttribute('d', `${pathD} L 1000 200 L 0 200 Z`);

    // Mousemove hover listener on chart wrapper
    const wrapper = document.getElementById('history-chart-wrapper');
    const tooltip = document.getElementById('hist-tooltip');
    const cursor = document.getElementById('hist-cursor-line');
    const callout = document.getElementById('hist-hover-callout');

    wrapper.onmousemove = (e) => {
      const rect = wrapper.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, relX / rect.width));
      const idx = Math.min(data.length - 1, Math.floor(pct * data.length));
      const item = data[idx];

      let unitLabel = currentHistMetric === 'kwh' ? 'kWh' : currentHistMetric === 'volt' ? 'V' : currentHistMetric === 'fuel' ? 'L' : '%';
      callout.innerText = `${item.date}: ${item[currentHistMetric]} ${unitLabel}`;

      cursor.style.left = `${relX}px`;
      cursor.classList.remove('hidden');

      tooltip.innerHTML = `<strong>${item.date}</strong><br>${item[currentHistMetric]} ${unitLabel}`;
      tooltip.style.left = `${Math.min(rect.width - 120, Math.max(10, relX - 50))}px`;
      tooltip.style.top = `60px`;
      tooltip.classList.remove('hidden');
    };

    wrapper.onmouseleave = () => {
      cursor.classList.add('hidden');
      tooltip.classList.add('hidden');
      callout.innerText = 'Hover across chart for daily telemetry record';
    };
  }

      else if (currentFilter === 'warning') matches = g.status === 'WARNING';
      else if (currentFilter === 'critical') matches = g.status === 'CRITICAL';

      const search = !searchQuery || 
        g.id.toLowerCase().includes(searchQuery) ||
        g.uid.toLowerCase().includes(searchQuery) ||
        g.station.toLowerCase().includes(searchQuery) ||
        g.operator.toLowerCase().includes(searchQuery) ||
        g.area.toLowerCase().includes(searchQuery);

      return matches && search;

    filtered.sort((a, b) => {
      if (currentSort === 'priority') {
        const ord = { 'CRITICAL': 0, 'WARNING': 1, 'RUNNING': 2, 'STANDBY': 3 };

  function searchOsmNominatim() {
    const input = document.getElementById('osm-search-input');
    if (!input || !mapInstance) return;
    const query = input.value.trim();
    if (!query) return;

    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ', Bangladesh')}&format=json&limit=1`;
    fetch(url, { headers: { 'User-Agent': 'Genesis-RMS-App' } })
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          mapInstance.setView([lat, lon], 12);
        } else {
          alert('Location not found in OpenStreetMap Nominatim index.');
        }
      })
      .catch(err => {
        console.warn('Nominatim geocode error:', err);
      });
  }

  // LIVE WAVEFORM CANVAS
  // =========================================================================
  function setupWaveformCanvas() {
    const canvas = document.getElementById('live-waveform-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let t = 0;

    function draw() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const mid = canvas.height / 2;
      const amp = canvas.height * 0.35;

      // Phase 1 (Red)
      ctx.beginPath();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x++) {
        const y = mid + Math.sin((x + t) * 0.04) * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Phase 2 (Amber)
      ctx.beginPath();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x++) {
        const y = mid + Math.sin((x + t) * 0.04 + (2 * Math.PI / 3)) * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Phase 3 (Blue)
      ctx.beginPath();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x++) {
        const y = mid + Math.sin((x + t) * 0.04 + (4 * Math.PI / 3)) * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      t += 2;
      requestAnimationFrame(draw);
    }
    draw();
  }

    if (arcEl) {
      const totalLen = 235.97;
      const pct = Math.min(1.0, Math.max(0.0, rpm / 2000.0));

      arcEl.style.strokeDashoffset = offset.toFixed(2);

  // =========================================================================

  // Generic HTML5 Canvas Image Resizer / Center-Cropper to Exact Target Dimensions
  function formatImageCanvas(file, targetW, targetH, callback) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Calculate aspect fill & center crop
        const scale = Math.max(targetW / img.width, targetH / img.height);
        const sw = img.width * scale;
        const sh = img.height * scale;
        const ox = (targetW - sw) / 2;
        const oy = (targetH - sh) / 2;

        ctx.clearRect(0, 0, targetW, targetH);
        ctx.drawImage(img, ox, oy, sw, sh);
        const base64 = canvas.toDataURL('image/png');
        callback(base64, targetW, targetH);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

        nextService: 'in 1,915 h'
      };
      BANNER_GENERATORS.push(newGen);

      // Add to hero dropdown
      const selEl = document.getElementById('hero-device-selector');
      if (selEl) {
        const opt = document.createElement('option');
        opt.value = newGen.id;
        opt.textContent = `${newGen.id} · ${brand} (${kva} kVA)`;
        selEl.appendChild(opt);
      }

      switchHeroGenerator(BANNER_GENERATORS.length - 1);
      alert(`New Generator "${brand}" added to Dynamic Banner!`);
    }

    closeBannerUploadModal();
  }

  // Restore Persisted Data on DOM ready
  function initDynamicUploadRestoration() {
    // 1. User Avatar (300x300)
    const savedAvatar = localStorage.getItem('genesis_user_avatar_300');
    if (savedAvatar) {
      const headerImg = document.getElementById('header-avatar-img');
      const headerInitials = document.getElementById('header-avatar-initials');
      const profImg = document.getElementById('prof-avatar-img');
      const profInitials = document.getElementById('prof-avatar-initials');
      if (headerImg) {
        headerImg.src = savedAvatar;
        headerImg.classList.remove('hidden');
      }
      if (headerInitials) headerInitials.classList.add('hidden');
      if (profImg) {
        profImg.src = savedAvatar;
        profImg.classList.remove('hidden');
      }
      if (profInitials) profInitials.classList.add('hidden');
    }

    // 2. Generator Thumbnails (100x100)
    try {
      const savedThumbs = JSON.parse(localStorage.getItem('genesis_gen_thumbnails') || '{}');
      Object.keys(savedThumbs).forEach(id => {
        const gen = GENERATORS.find(g => g.id === id);
        if (gen) gen.image = savedThumbs[id];
      });
      if (typeof renderCards === 'function') renderCards();
    } catch (e) {}
  }

</script>
</body>
