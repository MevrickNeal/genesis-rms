  <style>
    /* Custom Industrial Glassmorphic Tokens */
    body {
      background: #f1f5f9;
      background-image: 
        radial-gradient(at 10% 10%, rgba(226, 232, 240, 0.6) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(203, 213, 225, 0.4) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(241, 245, 249, 0.8) 0px, transparent 50%);
      min-height: 100vh;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    /* Left Floating Rail - Adaptive Industrial Capsule */
    .left-rail {
      width: 58px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 76px;
      max-height: calc(100vh - 86px);
      height: auto;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      z-index: 40;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior: contain;
      flex-shrink: 0;
    }
    .left-rail::-webkit-scrollbar {
      display: none;
    }

    .rail-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      flex-shrink: 0;
    }

    .rail-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
      transform: translateY(-1px);
    }

    .rail-btn-active {
      background: #0f172a !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.3);
    }

    .rail-btn-active::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 7px;
      bottom: 7px;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
      background: #9ede4c;
    }

    /* Alesha Hyacinth Custom Card Geometry */
    .card-wrap {
      position: relative;
      width: 100%;
      height: 250px;
      filter: drop-shadow(0 4px 16px rgba(15, 23, 42, 0.06));
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
      cursor: pointer;
    }
    .card-wrap:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 10px 24px rgba(15, 23, 42, 0.12));
    }
    .card-svg-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .card-inner-content {
      position: relative;
      z-index: 10;
      padding: 16px 18px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #gis-map {
      width: 100% !important;
      height: 700px !important;
      min-height: 700px !important;
      position: relative;
      z-index: 10;
    }

    /* Studio Showroom Pedestal */
    .hero-stage-bg {
      background: 
        radial-gradient(ellipse at 70% 65%, rgba(255, 255, 255, 0.98) 0%, rgba(240, 246, 252, 0.7) 40%, rgba(220, 233, 246, 0.35) 70%, transparent 100%),
        linear-gradient(135deg, #f0f5fa 0%, #e3ecf6 50%, #d4e2f0 100%);

    }
    .hero-pedestal {
      position: absolute;
      bottom: 25px;
      right: 90px;
      width: 580px;
      height: 135px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.98) 0%, rgba(245,250,255,0.85) 45%, rgba(215,228,242,0.4) 75%, transparent 100%);

      border: 1px solid rgba(255,255,255,0.85);
      transform: perspective(600px) rotateX(45deg);
      pointer-events: none;
      z-index: 1;
    }

    /* Spec Pill */
    .hero-spec-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);

    .scada-controller-card {

      max-width: 320px;
      cursor: pointer;
      transition: all 0.2s ease;

    .scada-controller-card:hover {
      border-color: #10b981;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.2);
    }

    /* Toggle Switch */
    .switch, .switch-toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 20px;
    }
    .switch-slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .switch-slider {
      background-color: #10b981;
    }
    input:checked + .switch-slider:before {
      transform: translateX(16px);
    }

    /* CMS Drag & Priority Styles */
    .cms-module-item {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cms-module-item:hover {

      border-color: #94a3b8;
    }
    .dragging {

      transform: scale(0.98);

      height: 2.375rem; /* 38px */
      padding: 0 1rem;

    /* ========================================================================= */
    /* CODEFRONTS GLASSMORPISM CARD MODEL (Downloads\dark-mode-glassmorphism-card-tailwind.html) */
    /* ========================================================================= */
    :root {
      --glz-fill: rgba(255, 255, 255, 0.65);
      --glz-ink: #232838;
      --glz-sub: rgba(35, 40, 56, 0.65);
      --glz-line: rgba(255, 255, 255, 0.85);
      --glz-btn: #232838;
      --glz-btn-ink: #f4f6fd;
      --glz-shadow: 0 24px 48px -22px rgba(10, 14, 30, 0.22), inset 0 1px 0 var(--glz-line);
    }

    html.dark, body.theme-dark {
      --glz-fill: rgba(18, 22, 36, 0.55);
      --glz-ink: #edf1fb;
      --glz-sub: rgba(237, 241, 251, 0.65);
      --glz-line: rgba(255, 255, 255, 0.16);
      --glz-btn: #edf1fb;
      --glz-btn-ink: #171c2c;
      --glz-shadow: 0 24px 48px -22px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .glz-card {
      width: 100%;
      padding: 22px 20px;
      border-radius: 22px;
      color: var(--glz-ink);
      background: var(--glz-fill);
      backdrop-filter: blur(20px) saturate(160%);

      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;

    .glz-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 32px 64px -20px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--glz-line);
    }
    html.dark .glz-card:hover, body.theme-dark .glz-card:hover {
      box-shadow: 0 32px 64px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .glz-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid var(--glz-line);

    /* Switch toggle in card */
    .switch-toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch-toggle input { opacity: 0; width: 0; height: 0; }
    .switch-slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 20px;
    }
    .switch-slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .switch-slider { background-color: #10b981; }
    input:checked + .switch-slider:before { transform: translateX(16px); }

  </style>
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('scada_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>
